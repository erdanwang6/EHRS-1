<mat-accordion class="role-menu">
    <mat-expansion-panel *ngFor="let section of visibleSections" class="role-panel" [expanded]="visibleSections.length === 1">
        <mat-expansion-panel-header>
            <mat-panel-title>
                <span class="role-title">{{section.title}}</span>
            </mat-panel-title>
        </mat-expansion-panel-header>

        <button
            *ngFor="let item of section.items"
            class="menu-buttons"
            mat-button
            [routerLink]="item.route"
            [queryParams]="getQueryParams(item)"
            routerLinkActive="active-link">
            {{item.label}}
        </button>
    </mat-expansion-panel>
</mat-accordion>
