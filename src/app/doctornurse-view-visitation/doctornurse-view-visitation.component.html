<div class="history-summary" data-testid="visitation-summary">{{historySummary}}</div>

<div class="history" *ngIf="visitationData.length; else noVisitationHistory">
	<table>
		<tr>
			<th>Date</th>
			<th>Reason</th>
			<th>Symptoms</th>
			<th>Summary</th>
			<th>Status</th>
		</tr>
		<tr *ngFor="let visit of visitationData" data-testid="visitation-row">
			<td>{{visit.visit_date}}</td>
			<td>{{visit.visit_reason}}</td>
			<td>{{visit.symptoms || 'N/A'}}</td>
			<td>{{visit.visit_summary || 'N/A'}}</td>
			<td>{{visit.status}}</td>
		</tr>
	</table>
</div>

<ng-template #noVisitationHistory>
	<div class="history-empty">No visitation history found for that patient.</div>
</ng-template>
