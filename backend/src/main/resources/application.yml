server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ehrs-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=EHRS;encrypt=false;trustServerCertificate=true;integratedSecurity=true}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

ehrs:
  cors:
    allowed-origin-patterns: ${EHRS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  auth:
    token-secret: ${EHRS_AUTH_TOKEN_SECRET:EHRS_LOCAL_DEV_SECRET_CHANGE_ME}
    token-hours: ${EHRS_AUTH_TOKEN_HOURS:12}
